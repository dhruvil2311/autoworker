<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ghost Retail</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
      
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { width: 320px; font-family: 'Inter', sans-serif; background: #0F1117; color: #E8ECF4; padding: 16px; }
      
      .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
      .brand { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
      .brand-icon { width: 24px; height: 24px; border-radius: 6px; background: linear-gradient(135deg, #00D68F, #007AFF); display: grid; place-items: center; color: white; font-weight: 800; font-size: 12px; }
      
      .status-pill { background: #1A1D2B; border: 1px solid #2A2D3E; border-radius: 9999px; padding: 4px 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
      .status-pill.recording { color: #FF6B6B; background: rgba(255,107,107,0.1); border-color: rgba(255,107,107,0.2); }
      .status-pill.recording .dot { background: #FF6B6B; box-shadow: 0 0 8px #FF6B6B; animation: pulse 1.5s infinite; }
      .status-pill.paused { color: #FFB547; background: rgba(255,181,71,0.1); border-color: rgba(255,181,71,0.2); }
      .status-pill.paused .dot { background: #FFB547; }
      .status-pill.uploading { color: #3b82f6; background: rgba(59,130,246,0.1); border-color: rgba(59,130,246,0.2); }
      .status-pill.uploading .dot { background: #3b82f6; animation: pulse 1s infinite; }
      .status-pill.error { color: #ef4444; background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.2); }
      .status-pill.error .dot { background: #ef4444; }
      .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: #5D6480; }
      
      @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

      .card { background: #1A1D2B; border: 1px solid #2A2D3E; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
      .timer { font-size: 32px; font-weight: 600; text-align: center; margin: 16px 0; font-variant-numeric: tabular-nums; }
      
      .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: none; border-radius: 8px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; padding: 12px; cursor: pointer; transition: all 0.2s; margin-bottom: 8px; }
      .btn:last-child { margin-bottom: 0; }
      .btn-primary { background: linear-gradient(135deg, #00D68F, #00B87A); color: #000; }
      .btn-primary:hover:not(:disabled) { opacity: 0.9; }
      .btn-secondary { background: #12141E; color: #E8ECF4; border: 1px solid #2A2D3E; }
      .btn-secondary:hover:not(:disabled) { background: #1F2337; }
      .btn-danger { background: rgba(255,107,107,0.15); color: #FF6B6B; }
      .btn-danger:hover:not(:disabled) { background: rgba(255,107,107,0.25); }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }

      .view-idle, .view-recording, .view-uploading, .view-error { display: none; }
      body.state-idle .view-idle { display: block; }
      body.state-recording .view-recording { display: block; }
      body.state-uploading .view-uploading { display: block; }
      body.state-error .view-error { display: block; }
      
      .msg-container { text-align: center; font-size: 13px; color: #8B92A8; margin-top: 12px; min-height: 40px; }
      .error-text { color: #fca5a5; font-size: 13px; margin: 12px 0; text-align: center; word-break: break-word; }
    </style>
  </head>
  <body class="state-idle">
    <div class="header">
      <div class="brand"><div class="brand-icon">G</div> Ghost</div>
      <div class="status-pill" id="status-badge"><div class="dot"></div> <span id="status-text">Ready</span></div>
    </div>

    <!-- IDLE VIEW -->
    <div class="view-idle">
      <div class="card" id="connection-card">
        <div style="text-align: center; margin-bottom: 8px;">
          <svg id="icon-connected" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#00D68F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none; margin: 0 auto 12px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
          <svg id="icon-disconnected" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#8B92A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto 12px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <div style="font-weight: 600; font-size: 14px;" id="connection-title">Not Connected</div>
          <div style="font-size: 12px; color: #8B92A8; margin-top: 4px;" id="connection-subtitle">Open the Ghost dashboard to connect this extension.</div>
        </div>
      </div>
      <button class="btn btn-primary" id="btn-start" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
        Start Demonstration
      </button>
    </div>

    <!-- RECORDING VIEW -->
    <div class="view-recording">
      <div class="card">
        <div class="timer" id="timer-display">00:00</div>
        <p style="text-align: center; font-size: 12px; color: #8B92A8; margin-bottom: 16px;">
          Perform the task as you normally would. Ghost will watch and learn.
        </p>
        <button class="btn btn-secondary" id="btn-pause-resume">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="icon-pause"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="icon-resume" style="display: none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <span id="text-pause-resume">Pause Recording</span>
        </button>
      </div>
      <button class="btn btn-danger" id="btn-stop">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
        Finish Recording
      </button>
    </div>

    <!-- UPLOADING VIEW -->
    <div class="view-uploading">
      <div class="card" style="text-align: center; padding: 32px 16px;">
        <p style="color: #E8ECF4; margin-bottom: 8px; font-weight: 500;">Uploading recording...</p>
        <p style="font-size: 12px; color: #8B92A8;">Please leave this page open until it completes.</p>
      </div>
    </div>
    
    <!-- ERROR VIEW -->
    <div class="view-error">
      <div class="card" style="text-align: center;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto 12px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <div style="font-weight: 600; font-size: 14px; color: #ef4444;">Upload Failed</div>
        <div class="error-text" id="error-display">Network error occurred.</div>
      </div>
      <button class="btn btn-primary" id="btn-retry">
        Retry Upload
      </button>
      <button class="btn btn-secondary" id="btn-cancel-error">
        Cancel Recording
      </button>
    </div>

    <div class="msg-container" id="message-container"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
